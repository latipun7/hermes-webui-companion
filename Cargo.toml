[workspace]
resolver = "2"
members = ["crates/common", "crates/renderer", "crates/sidecar"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/latipun7/hermes-webui-companion"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -2 }
rust_2024_compatibility = { level = "deny", priority = -2 }
unsafe_code = { level = "deny", priority = -1 }
