name: 🚀

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  code-quality:
    uses: ./.github/workflows/ci.yml

  build-sidecar:
    name: ⚙️ Sidecar (Linux)
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 📦 Setup mise
        id: setup-mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          experimental: true

      - name: ♻️ Manage Build Cache
        id: cache-rust
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.rustup/toolchains/
            ~/.cargo/
            target/
          key: rust-sidecar-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-sidecar-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
            rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
            rust-${{ runner.os }}-

      # HACK: based on https://github.com/jdx/mise-action/issues/215
      - name: ⚙️ Force Reinstall Rust Toolchains on Cache Miss
        if: ${{ steps.setup-mise.outputs.cache-hit == 'true' && steps.cache-rust.outputs.cache-hit != 'true' }}
        run: mise install --force rust

      - name: 🛠️ Build
        run: cargo build --locked --release -p hermes-webui-companion-sidecar

      - name: 📁 Stage
        shell: bash
        run: |
          mkdir -p staging
          cp target/release/hermes-webui-companion-sidecar staging/
          cp docs/hermes-webui-companion-sidecar.service staging/

      - name: ⬆️ Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-webui-companion-sidecar
          path: staging/
          retention-days: 5

  build-renderer:
    name: ⚙️ Renderer (${{ matrix.os-label }})
    needs: [code-quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-label: Linux
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            os-label: macOS
            target: x86_64-apple-darwin
          - os: windows-latest
            os-label: Windows
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 📦 Setup mise
        id: setup-mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          experimental: true

      - name: ♻️ Manage Build Cache
        id: cache-rust
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.rustup/toolchains/
            ~/.cargo/
            target/
          key: rust-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
            rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
            rust-${{ runner.os }}-

      # HACK: based on https://github.com/jdx/mise-action/issues/215
      - name: ⚙️ Force Reinstall Rust Toolchains on Cache Miss
        if: ${{ steps.setup-mise.outputs.cache-hit == 'true' && steps.cache-rust.outputs.cache-hit != 'true' }}
        run: mise install --force rust

      - name: 🎯 Add cross-compilation target
        run: rustup target add ${{ matrix.target }}

      - name: 🔗 Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y update
          sudo apt-get -y install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: 🛠️ Build
        run: |
          cargo build --locked --release \
            --target ${{ matrix.target }} \
            -p hermes-webui-companion-renderer \
            --features gui \
            --bin hermes-webui-companion-gui

      - name: 📁 Stage (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          PREFIX="hermes-webui-companion-gui-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/hermes-webui-companion-gui" "staging/${PREFIX}"
          chmod +x "staging/${PREFIX}"

      - name: 📁 Stage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir staging -Force
          $prefix = "hermes-webui-companion-gui-${{ matrix.target }}"
          Copy-Item "target/${{ matrix.target }}/release/hermes-webui-companion-gui.exe" "staging/${prefix}.exe"

      - name: ⬆️ Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-webui-companion-gui-${{ matrix.target }}
          path: staging/
          retention-days: 5

  release:
    name: 🚀 Create Release
    if: github.ref_type == 'tag'
    needs: [build-sidecar, build-renderer]
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: ⬇️ Download All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: artifacts

      - name: 📦 Setup mise
        id: setup-mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          experimental: true

      - name: 📝 Generate Changelog
        run: cog changelog --at ${{ github.ref_name }} -t .cog/gh-release.tera > github_changelog.md

      - name: 🗃️ Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: github_changelog.md
          files: artifacts/*
