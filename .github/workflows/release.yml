name: 🚀

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  code-quality:
    uses: ./.github/workflows/ci.yml

  build-sidecar:
    name: ⚙️ Sidecar (Linux)
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 🦀 Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: ♻️ Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/
            target/
          key: cargo-sidecar-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-sidecar-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
            cargo-sidecar-${{ runner.os }}-

      - name: 🛠️ Build
        run: cargo build --locked --release -p hermes-webui-companion-sidecar

      - name: 📁 Stage
        shell: bash
        run: |
          mkdir -p staging
          cp target/release/hermes-webui-companion-sidecar staging/
          cp docs/hermes-webui-companion-sidecar.service staging/

      - name: ⬆️ Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-webui-companion-sidecar
          path: staging/
          retention-days: 5

  build-renderer:
    name: ⚙️ Renderer (${{ matrix.os-label }})
    needs: [code-quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-label: Linux
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            os-label: macOS
            target: x86_64-apple-darwin
          - os: windows-latest
            os-label: Windows
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 📦 Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y update
          sudo apt-get -y install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: 🦀 Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 📦 Install Tauri CLI
        run: npx --yes @tauri-apps/cli@latest --help

      - name: ♻️ Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/
            target/
          key: cargo-renderer-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-renderer-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
            cargo-renderer-${{ matrix.target }}-

      - name: 🛠️ Tauri Build
        run: npx --yes @tauri-apps/cli@latest build --features gui
        working-directory: crates/renderer

      - name: 📁 Stage (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          PREFIX="hermes-webui-companion-renderer-${{ matrix.target }}"
          cp "target/release/hermes-webui-companion-gui" "staging/${PREFIX}"
          chmod +x "staging/${PREFIX}"
          if ls target/release/bundle/*/ 2>/dev/null; then
            cp -r target/release/bundle/*/* "staging/" 2>/dev/null || true
          fi

      - name: 📁 Stage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir staging -Force
          $prefix = "hermes-webui-companion-renderer-${{ matrix.target }}"
          Copy-Item "target/release/hermes-webui-companion-gui.exe" "staging/${prefix}.exe"
          if (Test-Path "target/release/bundle/*/") {
            Get-ChildItem "target/release/bundle/*/*" | Copy-Item -Destination staging
          }

      - name: ⬆️ Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-webui-companion-renderer-${{ matrix.target }}
          path: staging/
          retention-days: 5

  release:
    name: 🚀 Create Release
    if: github.ref_type == 'tag'
    needs: [build-sidecar, build-renderer]
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: ⬇️ Download All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: artifacts

      - name: 🗃️ List Artifacts
        shell: bash
        run: find artifacts -type f | sort

      - name: 🗃️ Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: artifacts/*
