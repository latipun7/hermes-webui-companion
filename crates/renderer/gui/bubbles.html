<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Companion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      pointer-events: none;
    }
    #card {
      display: none;
      box-sizing: border-box;
      max-width: 280px;
      margin-top: 2px;
      padding: 10px 12px 10px 34px;
      border: 1.5px solid #45475a;
      border-radius: 22px;
      background: #1e1e2e;
      color: #cdd6f4;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.04) inset,
        0 4px 12px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
      cursor: pointer;
      position: relative;
    }
    #card.visible { display: block; }
    #card.opening {
      opacity: 0.6;
      pointer-events: none;
    }
    #status-dot {
      position: absolute;
      left: 12px;
      top: 13px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .status-approval #status-dot { background: #f9e2af; }
    .status-clarify  #status-dot { background: #b4befe; }
    .status-running  #status-dot {
      background: transparent;
      border: 2px solid #a6adc8;
      border-top-color: #89b4fa;
      animation: spin 0.85s linear infinite;
    }
    .status-ready    #status-dot { background: #a6e3a1; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #text {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.35;
      color: #a6adc8;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="card">
    <div id="status-dot"></div>
    <div id="title"></div>
    <div id="text"></div>
  </div>
  <script src="bubbles.js"></script>
</body>
</html>
