<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Companion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      pointer-events: none;
    }
    #card {
      display: none;
      box-sizing: border-box;
      max-width: 280px;
      margin-top: 2px;
      padding: 10px 12px 10px 32px;
      border: 2px solid rgba(210, 214, 229, 0.95);
      border-radius: 22px;
      background: #f1f3fa;
      color: #555a75;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.55) inset,
        0 4px 10px rgba(0, 0, 0, 0.14);
      pointer-events: auto;
      cursor: pointer;
      position: relative;
    }
    #card.visible { display: block; }
    #status-dot {
      position: absolute;
      left: 10px;
      top: 12px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }
    .status-approval #status-dot { background: #d97706; }
    .status-clarify  #status-dot { background: #8b5cf6; }
    .status-running  #status-dot { background: #9ca1b5; border: 2px solid #9ca1b5; border-top-color: transparent; animation: spin 0.85s linear infinite; }
    .status-ready    #status-dot { background: #08b153; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.16;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #text {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.25;
      color: #686d84;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="card">
    <div id="status-dot"></div>
    <div id="title"></div>
    <div id="text"></div>
  </div>
  <script src="bubbles.js"></script>
</body>
</html>
