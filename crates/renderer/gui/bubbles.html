<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Companion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font: 11px/1.4 system-ui, -apple-system, sans-serif;
      color: #e4e4e7;
    }
    #click-target {
      position: absolute;
      inset: 0;
      z-index: 1;
      /* invisible, enables hit testing on transparent window */
    }
    #container {
      display: none;
      position: relative;
      z-index: 2;
      padding: 8px 16px;
      border-radius: 22px;
      background: rgba(22, 22, 28, 0.85);
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    #container.visible {
      display: block;
    }
    #title {
      font-weight: 600;
      font-size: 11px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f4f4f5;
    }
    #text {
      font-size: 10px;
      color: #a1a1aa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #status-icon {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    .status-approval #status-icon { background: #f59e0b; }
    .status-clarify  #status-icon { background: #a78bfa; }
    .status-running  #status-icon { background: #3b82f6; animation: pulse 1s infinite; }
    .status-ready    #status-icon { background: #22c55e; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div id="click-target"></div>
  <div id="container">
    <div id="title"><span id="status-icon"></span><span id="title-text"></span></div>
    <div id="text"></div>
  </div>
  <script src="bubbles.js"></script>
</body>
</html>
