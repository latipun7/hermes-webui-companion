<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Companion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: max-content;
      min-width: 120px;
      min-height: 44px;
      padding: 10px 16px;
      border-radius: 22px;
      background: rgba(18, 18, 22, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      font: 12px/1.4 system-ui, -apple-system, sans-serif;
      color: #e4e4e7;
      cursor: pointer;
    }
    body.empty #title,
    body.empty #text {
      display: none;
    }
    #title {
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f4f4f5;
    }
    #text {
      font-size: 11px;
      color: #a1a1aa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #status-icon {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    .status-approval #status-icon { background: #f59e0b; }
    .status-clarify  #status-icon { background: #a78bfa; }
    .status-running  #status-icon { background: #3b82f6; animation: pulse 1s infinite; }
    .status-ready    #status-icon { background: #22c55e; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div id="title"><span id="status-icon"></span><span id="title-text"></span></div>
  <div id="text"></div>
  <script src="bubbles.js"></script>
</body>
</html>
