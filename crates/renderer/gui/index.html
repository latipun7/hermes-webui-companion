<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Companion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; border: 0; outline: none; }
    html, body {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }
    #pet-sprite {
      position: absolute;
      inset: 0;
      background-size: 800% 900%;
      background-repeat: no-repeat;
      image-rendering: pixelated;
    }
    #bubble-toggle {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      -webkit-app-region: no-drag;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      user-select: none;
      line-height: 1;
    }
    #bubble-toggle:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
      color: rgba(255, 255, 255, 0.6);
    }
    #bubble-toggle.on {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.35);
      color: rgba(255, 255, 255, 0.5);
    }

    /* ── Context menu ─────────────────────────────────── */
    #context-menu {
      display: none;
      position: fixed;
      z-index: 100;
      min-width: 180px;
      background: rgba(18, 18, 22, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      padding: 4px 0;
      font-family: system-ui, "Segoe UI", sans-serif;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
      -webkit-app-region: no-drag;
    }
    #context-menu.show {
      display: block;
      animation: ctx-fade-in 0.1s ease-out;
    }
    @keyframes ctx-fade-in {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    .ctx-item {
      display: flex;
      align-items: center;
      height: 32px;
      padding: 0 12px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .ctx-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .ctx-separator {
      height: 1px;
      margin: 4px 8px;
      background: rgba(255, 255, 255, 0.06);
    }
  </style>
</head>
<body>
  <div id="pet-sprite"></div>
  <div id="bubble-toggle" class="on" title="Toggle bubble">▼</div>

  <div id="context-menu">
    <div class="ctx-item" data-action="restart">Restart pet</div>
    <div class="ctx-separator"></div>
    <div class="ctx-item" data-action="close">Close pet</div>
  </div>

  <script src="pet.js"></script>
</body>
</html>
