<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Companion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; border: 0; outline: none; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      -webkit-app-region: drag;
    }
    #pet-sprite {
      position: absolute;
      inset: 0;
      background-size: 800% 900%;
      background-repeat: no-repeat;
      image-rendering: pixelated;
    }
    #bubbles {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      max-width: 90%;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font: 9px/1.3 system-ui, sans-serif;
      padding: 4px 8px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #bubbles.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="bubbles"></div>
  <div id="pet-sprite"></div>
  <script src="pet.js"></script>
</body>
</html>
