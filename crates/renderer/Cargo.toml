[package]
name = "hermes-webui-companion-renderer"
version.workspace = true
edition = "2024"
repository.workspace = true
license.workspace = true
default-run = "hermes-webui-companion-gui"

[package.metadata]

[lib]
name = "companion_renderer"
path = "src/lib.rs"

[[bin]]
name = "hermes-webui-companion-renderer"
path = "src/main.rs"

[[bin]]
name = "hermes-webui-companion-gui"
path = "src/gui.rs"
required-features = ["gui"]

[dependencies]
image = "0.25.10"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.52.3", features = ["full"] }
ureq = { version = "3.3.0", features = ["json"] }
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tiny_http = { version = "0.12", optional = true }

[features]
gui = ["tauri", "tauri-plugin-process", "tauri-plugin-shell", "tauri-build", "tiny_http"]

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
